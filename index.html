    const tileNames = ["GO", "ANALYTICAL", "BONDING", "PERIODIC", "TITRATIONS", "VSEPR", "CONC.", "TITRATIONS", "ACID-BASE", "AUDIT", "ACID-BASE", "TITRATIONS", "LAB BONUS", "ANALYTICAL", "VSEPR", "CONC.", "AUDIT", "CONC.", "BONDING", "ACID-BASE", "BONDING", "VSEPR"];
    const ownerCols = ["#6c5ce7", "#00d2d3", "#e67e22", "#ff9ff3"];
    
    let players = [];
    let selectedAvatar = '🐱';
    let turn = 0, rolling = false, owners = {};
    let usedQsGlobal = [];
    let chosenSabotageAction = null;
    let chosenSabotageCost = 0;

    window.onload = function() {
        fetch('https://sheetdb.io/api/v1/9v4hyoxdw845s')
            .then(response => response.json())
            .then(data => {
                data.sort((a, b) => b.Points - a.Points);
                const topScores = data.slice(0, 5);
                const listEl = document.getElementById('leaderboardList');
                if (listEl) {
                    listEl.innerHTML = topScores.length === 0 ? '<li>No scores yet!</li>' : 
                        topScores.map(s => `<li><b>${s.Name}</b> — ${s.Points} PTS</li>`).join('');
                }
            })
            .catch(error => {
                document.getElementById('leaderboardList').innerHTML = '<li>Local mode active (Scores save locally)</li>';
            });
    };

    function selectAvatar(icon) {
        selectedAvatar = icon;
        for(let i=0; i<4; i++) {
            document.getElementById('avatar'+i).classList.remove('selected');
        }
        event.currentTarget.classList.add('selected');
    }

    function addPlayer() {
        const nameInput = document.getElementById('playerNameInput');
        let name = nameInput.value.trim();
        if(!name) { alert("Please enter a nickname!"); return; }
        if(players.length >= 4) { alert("Maximum 4 players allowed!"); return; }
        if(players.some(p => p.icon === selectedAvatar)) { alert("This avatar is already chosen! Pick another one."); return; }

        players.push({ id: players.length, icon: selectedAvatar, n: name, pos: 0, pts: 30, skip: false, rounds: 1 });
        nameInput.value = '';
        updateJoinedPlayersUI();
    }

    function updateJoinedPlayersUI() {
        const container = document.getElementById('joinedPlayersContainer');
        container.innerHTML = players.map(p => `<span class="joined-player-tag">${p.icon} ${p.n}</span>`).join('');
        document.getElementById('playerCount').innerText = players.length;
        document.getElementById('startBtn').disabled = players.length < 1;
    }

    function startGame(){
        if(players.length < 1) return;
        document.getElementById('screen-lobby').classList.remove('active');
        document.getElementById('screen-lobby').style.display = 'none';
        document.getElementById('screen-game').classList.add('active');
        initBoard();
    }

    function initBoard(){
        const b = document.getElementById('board');
        let idxs = [0,1,2,3,4,5, 21,-1,-1,-1,-1,6, 20,-1,-1,-1,-1,7, 19,-1,-1,-1,-1,8, 18,-1,-1,-1,-1,9, 17,16,15,14,13,12];
        idxs.forEach((idx, i) => {
            if(idx === -1) return;
            const t = document.createElement('div'); t.id = 't'+idx; t.className = 'tile';
            if(tileNames[idx] === "AUDIT") t.style.background = "var(--red)";
            t.innerHTML = `${tileNames[idx]}`;
            t.style.gridRow = Math.floor(i/6)+1; t.style.gridColumn = (i%6)+1;
            b.appendChild(t);
        });
        const d = document.getElementById('dashboard');
        players.forEach((p, i) => {
            const pc = document.createElement('div'); pc.id = 'piece'+p.id; pc.className = 'player-piece'; pc.innerText = p.icon;
            document.getElementById('piecesContainer').appendChild(pc);
            const st = document.createElement('div'); st.id = 'stat'+i; st.className = 'p-stat'+(i===0?' active-turn':'');
            st.innerHTML = `<span style="font-size:0.9rem;">${p.icon}</span><br><small style="font-size:0.55rem;">${p.n}</small><br><span style="font-size:0.55rem; color:var(--gold);" id="round${i}">Round ${p.rounds}/3</span><br><b id="pts${i}">${p.pts}</b>`;
            d.appendChild(st);
        });
        updateStatus(); updatePieces();
    }

    function rollDice(){
        if(rolling) return;
        let p = players[turn];
        rolling = true; // Lock rolling immediately
        
        if(p.skip){ 
            p.skip = false; 
            alert("Turn Skipped!"); 
            endTurn(); 
            return; 
        }
        
        play('roll');
        const dice = document.getElementById('dice'); dice.classList.add('rolling');
        const r = Math.floor(Math.random()*6)+1;
        setTimeout(()=>{
            dice.classList.remove('rolling');
            const rots = { 1: "rotateX(0deg) rotateY(0deg)", 2: "rotateY(180deg)", 3: "rotateY(-90deg)", 4: "rotateY(90deg)", 5: "rotateX(-90deg)", 6: "rotateX(90deg)" };
            dice.style.transform = rots[r];
            setTimeout(()=>{ movePlayer(r); }, 600);
        }, 1000);
    }

    function movePlayer(s){
        let p = players[turn]; let old = p.pos; p.pos = (p.pos + s) % 22;
        if(p.pos < old) { 
            p.pts += 50; p.rounds++;
            document.getElementById('roundAlert').style.display='block'; 
            setTimeout(()=>document.getElementById('roundAlert').style.display='none', 1500); 
            updateStats();
            if(p.rounds > 3) {
                checkEndGame(p);
                return;
            }
        }
        updatePieces(); 
        setTimeout(()=>handleLanding(p), 600);
    }

    function handleLanding(p){
        if(p.pos === 0) { endTurn(); return; }
        if(tileNames[p.pos] === "LAB BONUS") { p.pts += 40; alert("LAB BONUS! +40 PTS"); updateStats(); endTurn(); return; }
        if(tileNames[p.pos] === "AUDIT") { p.pts -= 20; alert("Audit Penalty! -20 PTS"); updateStats(); endTurn(); return; }
        if(owners[p.pos] !== undefined && owners[p.pos] !== turn){
            let rent = 25;
            let o = players[owners[p.pos]]; p.pts -= rent; o.pts += rent;
            alert(`Rent Paid: 25 PTS to ${o.icon} ${o.n}`); updateStats(); endTurn();
        } else { showQuestion(p.pos, p); }
    }

    function showQuestion(tid, p) {
        let pool = questions.filter(q => !usedQsGlobal.includes(q.id));
        if (pool.length === 0) { usedQsGlobal = []; pool = questions; }
        const q = pool[Math.floor(Math.random() * pool.length)];
        usedQsGlobal.push(q.id);

        document.getElementById('qOverlay').style.display = 'flex';
        document.getElementById('qHeader').innerText = q.mod;
        document.getElementById('qText').innerHTML = `<b>${q.text}</b>`;
        
        const area = document.getElementById('optionsArea');
        area.innerHTML = '';
        
        q.options.forEach(opt => {
            const b = document.createElement('button');
            b.className = 'btn-mcq';
            b.innerHTML = opt;
            b.onclick = () => {
                const isCorrect = (opt === q.correct);
                showResult(isCorrect, q, tid, p);
            };
            area.appendChild(b);
        });
    }

    function showResult(isCorrect, q, tid, p) {
        const area = document.getElementById('optionsArea');
        const color = isCorrect ? '#00d2d3' : '#ff7675';
        document.getElementById('qHeader').innerText = isCorrect ? "CORRECT!" : "INCORRECT!";
        document.getElementById('qHeader').style.color = color;
        
        area.innerHTML = `
            <div style="text-align:left; padding:15px; background:rgba(255,255,255,0.05); border-radius:15px; margin-bottom:15px;">
                <p style="font-size:0.9rem;">${q.explanation}</p>
            </div>
            <button class="btn" style="background:var(--primary)" onclick="processResult(${isCorrect}, ${tid}, ${q.price})">NEXT</button>
        `;
    }

    function processResult(isCorrect, tid, price) {
        document.getElementById('qHeader').style.color = 'white';
        let p = players[turn];
        if (isCorrect) {
            play('correct');
            p.pts += 20;
            updateStats();
            if (owners[tid] === undefined && p.pts >= price) showBuyMenu(tid, p, price);
            else endTurn();
        } else {
            play('wrong');
            p.pts -= 30;
            updateStats();
            endTurn();
        }
    }

    function showBuyMenu(tid, p, price){
        const area = document.getElementById('optionsArea');
        document.getElementById('qText').innerHTML = `Spend ${price} PTS to buy this tile?`;
        area.innerHTML = '';
        const b = document.createElement('button'); b.className = 'btn'; b.style.background = 'var(--gold)'; b.style.color='#000'; b.innerText = `PURCHASE`;
        b.onclick = () => {
            p.pts -= price; owners[tid] = turn;
            const t = document.getElementById('t'+tid);
            t.style.background = ownerCols[p.id]; t.innerHTML += `<span class="owner-tag">${p.icon}</span>`;
            endTurn();
        };
        const s = document.createElement('button'); s.className = 'btn'; s.style.background='#4b5563'; s.innerText = "PASS";
        s.onclick = endTurn;
        area.appendChild(b); area.appendChild(s);
    }

    function buySabotage() {
        let p = players[turn];
        if (p.pts < 50) { alert("You need at least 50 PTS to buy a Chance/Sabotage action!"); return; }

        const area = document.getElementById('optionsArea');
        document.getElementById('qHeader').innerText = "CHOOSE CHANCE ACTION";
        document.getElementById('qText').innerText = "Select an action to buy:";
        area.innerHTML = '';

        const b1 = document.createElement('button');
        b1.className = 'btn-mcq';
        b1.innerHTML = "<b>Skip Next Turn</b> (Cost: 50 PTS)";
        b1.onclick = () => selectSabotageAction('skip', 50);
        area.appendChild(b1);

        const b2 = document.createElement('button');
        b2.className = 'btn-mcq';
        b2.innerHTML = "<b>Deduct 20 PTS</b> (Cost: 50 PTS)";
        b2.onclick = () => selectSabotageAction('deduct', 50);
        area.appendChild(b2);

        const b3 = document.createElement('button');
        b3.className = 'btn-mcq';
        b3.innerHTML = "<b>Backward One Step</b> (Cost: 100 PTS)";
        b3.onclick = () => selectSabotageAction('backward', 100);
        area.appendChild(b3);

        const returnBtn = document.createElement('button');
        returnBtn.className = 'btn';
        returnBtn.style.background = '#4b5563';
        returnBtn.innerText = "Return to Game";
        returnBtn.onclick = () => {
            document.getElementById('qOverlay').style.display = 'none';
        };
        area.appendChild(returnBtn);

        document.getElementById('qOverlay').style.display = 'flex';
    }

    function selectSabotageAction(action, cost) {
        let p = players[turn];
        if (p.pts < cost) {
            alert(`You need at least ${cost} PTS for this action!`);
            return;
        }
        chosenSabotageAction = action;
        chosenSabotageCost = cost;

        const area = document.getElementById('optionsArea');
        document.getElementById('qText').innerText = `Select target opponent:`;
        area.innerHTML = '';

        players.forEach((target, i) => {
            if (i !== turn) {
                const b = document.createElement('button');
                b.className = 'btn-mcq';
                b.innerHTML = `Target ${target.icon} ${target.n}`;
                b.onclick = () => executeSabotage(target);
                area.appendChild(b);
            }
        });

        const backBtn = document.createElement('button');
        backBtn.className = 'btn';
        backBtn.style.background = '#4b5563';
        backBtn.innerText = "Back";
        backBtn.onclick = buySabotage;
        area.appendChild(backBtn);
    }

    function executeSabotage(target) {
        let attacker = players[turn];
        attacker.pts -= chosenSabotageCost;
        let msg = "";

        if (chosenSabotageAction === 'skip') {
            target.skip = true;
            msg = `Sabotage! ${target.n} will skip their next turn.`;
        } else if (chosenSabotageAction === 'deduct') {
            target.pts -= 20;
            msg = `Sabotage! You deducted 20 PTS from ${target.n}.`;
        } else if (chosenSabotageAction === 'backward') {
            target.pos = (target.pos - 1 + 22) % 22;
            updatePieces();
            msg = `Sabotage! ${target.n} was pushed backward one step.`;
        }

        document.getElementById('qOverlay').style.display = 'none';
        alert(msg);
        updateStats();
    }

    function endTurn(){
        document.getElementById('qOverlay').style.display = 'none';
        updateStats(); 
        document.getElementById('stat'+turn).classList.remove('active-turn');
        turn = (turn+1)%players.length;
        document.getElementById('stat'+turn).classList.add('active-turn');
        updateStatus();
        rolling = false; // Unlock rolling ONLY when the turn officially ends
    }

    function updateStats(){ 
        players.forEach((p,i)=>{
            document.getElementById('pts'+i).innerText = p.pts;
            document.getElementById('round'+i).innerText = `Round ${p.rounds}/3`;
        }); 
    }

    function updateStatus(){ document.getElementById('statusLabel').innerText = players[turn].icon + " " + players[turn].n + "'S TURN"; }
    
    function updatePieces(){
        players.forEach((p, i) => {
            const t = document.getElementById('t'+p.pos); const pc = document.getElementById('piece'+p.id);
            if(t && pc){ pc.style.left = (t.offsetLeft + (i%2)*10 + 2)+'px'; pc.style.top = (t.offsetTop + Math.floor(i/2)*10 + 2)+'px'; }
        });
    }

    function checkEndGame(winner) {
        let sortedPlayers = [...players].sort((a, b) => {
            if (b.rounds !== a.rounds) return b.rounds - a.rounds;
            return b.pts - a.pts;
        });

        const area = document.getElementById('optionsArea');
        document.getElementById('qHeader').innerText = "🏆 MATCH RESULTS 🏆";
        document.getElementById('qHeader').style.color = "var(--gold)";
        document.getElementById('qText').innerHTML = `<b>Winner: ${winner.icon} ${winner.n}!</b>`;
        
        let rankingHTML = '<div style="text-align:left; max-height:220px; overflow-y:auto; margin-bottom:15px;">';
        sortedPlayers.forEach((p, index) => {
            let medal = index === 0 ? '🥇' : (index === 1 ? '🥈' : (index === 2 ? '🥉' : '👤'));
            rankingHTML += `
                <div style="padding:8px 12px; background:rgba(255,255,255,0.05); border-radius:10px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; font-size:0.85rem;">
                    <span><b>${medal} #${index+1}</b> ${p.icon} ${p.n}</span>
                    <span><b>${p.pts} PTS</b></span>
                </div>`;
        });
        rankingHTML += '</div>';

        area.innerHTML = rankingHTML + '<button class="btn" style="background:var(--accent); color:#000;" onclick="submitScoreAndRestart(\'' + winner.icon + ' ' + winner.n + '\', ' + winner.pts + ')">SAVE & RESTART</button>';
        document.getElementById('qOverlay').style.display = 'flex';
    }

    function submitScoreAndRestart(winnerName, winnerPts) {
        const scoreData = {
            data: [
                { Name: winnerName, Points: winnerPts, Date: new Date().toLocaleDateString() }
            ]
        };

        fetch('https://sheetdb.io/api/v1/9v4hyoxdw845s', {
            method: 'POST',
            headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
            body: JSON.stringify(scoreData)
        })
        .then(() => { location.reload(); })
        .catch(() => { location.reload(); });
    }
</script>
